[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-tech-challenge-fase-1"
version = "0.1.0"
description = "Projeto de churn (Etapa 1): EDA, baselines e tracking com MLflow."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Equipe 20" },
  { name = "Antonio Henrique" },
  { name = "Joao Furlan" },
  { name = "Dionathan" },
  { name = "Bruno" },
  { name = "Paulo" }
]
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.4,<2.0",
  "mlflow>=2.12,<3.0",
  "matplotlib>=3.8,<4.0",
  "seaborn>=0.13,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.4,<1.0",
  "jupyter>=1.0,<2.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"