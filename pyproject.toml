[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-tech-challenge-fase-1"
version = "0.1.0"
description = "Projeto de churn (Etapa 1): EDA, baselines e tracking com MLflow."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Equipe 20" },
  { name = "Antonio Henrique" },
  { name = "Joao Furlan" },
  { name = "Dionathan" },
  { name = "Bruno" },
  { name = "Paulo" }
]
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.4,<2.0",
  "mlflow>=2.12,<3.0",
  "matplotlib>=3.8,<4.0",
  "seaborn>=0.13,<1.0",
  "torch>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.4,<1.0",
  "jupyter>=1.0,<2.0",
  "mypy>=1.10,<2.0",
  "pandas-stubs>=2.2,<3.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "FA",  # flake8-future-annotations
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "PD",  # pandas-vet
    "NPY", # numpy-specific rules
    "RUF", # ruff-specific rules
]
ignore = [
    "D100", # missing docstring in public module
    "D104", # missing docstring in public package
    "PD901", # df is a bad variable name. (it's common in DS)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "sklearn.*",
    "mlflow.*",
    "matplotlib.*",
    "seaborn.*",
    "numpy.*"
]
ignore_missing_imports = true